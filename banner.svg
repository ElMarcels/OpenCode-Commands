<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">opencode-commands</title>
  <desc id="d">A large collection of custom slash commands for opencode</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="20" fill="url(#dots)"/>
  <rect width="1280" height="320" rx="20" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="19.5" fill="none" stroke="#30363d"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <!-- Left: title block -->
    <text x="64" y="64" font-size="16" fill="#3fb950" letter-spacing="3">/ SLASH COMMAND LIBRARY</text>
    <text x="64" y="136" font-size="56" font-weight="700" fill="#f0f6fc">opencode<tspan fill="url(#accent)">-commands</tspan></text>
    <text x="64" y="182" font-size="22" fill="#8b949e">100+ ready-to-use custom commands for opencode</text>

    <!-- Category chips -->
    <g font-size="14" fill="#c9d1d9">
      <rect x="64" y="218" width="64" height="30" rx="15" fill="#21262d" stroke="#30363d"/>
      <text x="96" y="238" text-anchor="middle">git</text>
      <rect x="138" y="218" width="82" height="30" rx="15" fill="#21262d" stroke="#30363d"/>
      <text x="179" y="238" text-anchor="middle">review</text>
      <rect x="230" y="218" width="82" height="30" rx="15" fill="#21262d" stroke="#30363d"/>
      <text x="271" y="238" text-anchor="middle">testing</text>
      <rect x="322" y="218" width="96" height="30" rx="15" fill="#21262d" stroke="#30363d"/>
      <text x="370" y="238" text-anchor="middle">refactor</text>
      <rect x="428" y="218" width="64" height="30" rx="15" fill="#21262d" stroke="#30363d"/>
      <text x="460" y="238" text-anchor="middle">docs</text>
      <rect x="502" y="218" width="82" height="30" rx="15" fill="#21262d" stroke="#30363d"/>
      <text x="543" y="238" text-anchor="middle">devops</text>
    </g>
    <text x="64" y="284" font-size="14" fill="#6e7681">copy · paste · /run</text>

    <!-- Right: terminal window -->
    <g>
      <rect x="700" y="44" width="516" height="232" rx="12" fill="#0b0f14" stroke="#30363d"/>
      <path d="M700 56a12 12 0 0 1 12-12h492a12 12 0 0 1 12 12v22H700z" fill="#161b22"/>
      <line x1="700" y1="78" x2="1216" y2="78" stroke="#30363d"/>
      <circle cx="724" cy="61" r="6" fill="#ff5f56"/>
      <circle cx="746" cy="61" r="6" fill="#ffbd2e"/>
      <circle cx="768" cy="61" r="6" fill="#27c93f"/>
      <text x="958" y="66" font-size="13" fill="#6e7681" text-anchor="middle">opencode</text>

      <g font-size="18">
        <text x="728" y="116" fill="#6e7681">$ <tspan fill="#c9d1d9">opencode</tspan></text>

        <text x="728" y="150" fill="#3fb950">›</text>
        <text x="750" y="150" fill="#2dd4bf">/review</text>
        <text x="870" y="150" fill="#8b949e" font-size="15">Review current changes</text>

        <text x="728" y="182" fill="#3fb950">›</text>
        <text x="750" y="182" fill="#2dd4bf">/test</text>
        <text x="870" y="182" fill="#8b949e" font-size="15">Generate unit tests</text>

        <text x="728" y="214" fill="#3fb950">›</text>
        <text x="750" y="214" fill="#2dd4bf">/commit</text>
        <text x="870" y="214" fill="#8b949e" font-size="15">Write commit message</text>

        <text x="728" y="246" fill="#3fb950">›</text>
        <text x="750" y="246" fill="#2dd4bf">/pr</text>
        <rect x="796" y="231" width="10" height="20" fill="#2dd4bf">
          <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>
</svg>
